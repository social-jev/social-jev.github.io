name: Publish website and documentation
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [package-docs]
  workflow_dispatch:
    inputs:
      docs_version:
        description: 'Existing documentation version to update; leave empty to publish the website'
        type: string
        default: ''
      fetch_docs_from_branch:
        description: 'Package branch containing the corrected documentation'
        type: string
        default: main
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: website
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: published
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: social-jev/social-jev
          ref: ${{ format('refs/heads/{0}', inputs.fetch_docs_from_branch || 'main') }}
          fetch-depth: 0
          persist-credentials: false
          path: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build website only for website updates
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.docs_version == '')
        working-directory: website
        run: |
          npm ci
          npm run build
          npm test
          rsync -a --delete --exclude docs/ --exclude .git/ dist/client/ ../published/
          if [[ ! -f ../published/docs/versions.json ]]; then
            cp dist/client/docs/index.html ../published/docs/index.html
          fi
      - name: Build missing package releases
        if: github.event_name == 'repository_dispatch'
        run: |
          bash website/scripts/build-release-docs.sh "$GITHUB_WORKSPACE/package" "$GITHUB_WORKSPACE/published"
          node website/scripts/update-doc-versions.mjs "$GITHUB_WORKSPACE/published/docs"
      - name: Rebuild selected documentation version
        if: github.event_name == 'workflow_dispatch' && inputs.docs_version != ''
        env:
          DOCS_VERSION: ${{ inputs.docs_version }}
        run: |
          bash website/scripts/rebuild-docs.sh \
            "$GITHUB_WORKSPACE/package" \
            "$GITHUB_WORKSPACE/published" \
            "$DOCS_VERSION"
      - name: Check for publishing changes
        id: changes
        working-directory: published
        run: |
          git add .
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          path: published
      - name: Deploy combined website and docs
        id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Save successfully published content
        if: steps.changes.outputs.changed == 'true'
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update published website and documentation'
          git push origin HEAD:published
