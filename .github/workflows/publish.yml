name: Publish website and documentation
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [package-docs]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
      - uses: actions/checkout@v4
        with:
          ref: published
          path: published
      - uses: actions/checkout@v4
        with:
          repository: DGoettlich/social-jev
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Build website only for website updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: website
        run: |
          npm ci
          npm run build
          npm test
          rsync -a --delete --exclude docs/ --exclude .git/ dist/client/ ../published/
      - name: Build missing package releases
        if: github.event_name == 'repository_dispatch'
        run: |
          bash website/scripts/build-release-docs.sh "$GITHUB_WORKSPACE/package" "$GITHUB_WORKSPACE/published"
          node website/scripts/update-doc-versions.mjs "$GITHUB_WORKSPACE/published/docs"
      - name: Check for publishing changes
        id: changes
        working-directory: published
        run: |
          git add .
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          path: published
      - name: Deploy combined website and docs
        id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Save successfully published content
        if: steps.changes.outputs.changed == 'true'
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update published website and documentation'
          git push origin HEAD:published
